name: Reusable Docker Build, Push & env-holder Trigger

on:
  workflow_call:
    inputs:
      service-names:
        description: 'JSON array of service/image names (e.g. ["ledger-backend"] or ["api","auth","user"])'
        type: string
        required: true
      image-prefix:
        description: 'Prefix added before service name (e.g. "hrms-" -> hrms-api)'
        type: string
        default: ''
      use-build-arg-app-name:
        description: 'Pass --build-arg APP_NAME=<service> to Docker for NestJS monorepos'
        type: boolean
        default: false
      dockerfile-target:
        description: 'Target stage for multi-stage Dockerfiles (e.g. "production")'
        type: string
        default: ''
      dockerfile-context:
        description: 'Docker build context path'
        type: string
        default: '.'
      dockerfile-path:
        description: 'Relative path to Dockerfile'
        type: string
        default: 'Dockerfile'
      registry-host:
        description: 'Container registry hostname (e.g. "registry.gitlab.com" or "ghcr.io")'
        type: string
        default: 'registry.gitlab.com'
      trigger-env-holder:
        description: 'Automatically trigger env-holder deploy webhook once all images are pushed'
        type: boolean
        default: true
    secrets:
      REGISTRY_URL:
        description: 'Base registry repository URL (e.g. registry.gitlab.com/user/project)'
        required: true
      REGISTRY_USER:
        description: 'Registry username or Deploy Token username'
        required: true
      REGISTRY_PASSWORD:
        description: 'Registry password or Deploy Token'
        required: true
      ENV_HOLDER_WEBHOOK_URL:
        description: 'Per-service webhook URL from env-holder dashboard'
        required: false

jobs:
  build-and-push:
    name: 🐳 Build & Push [${{ matrix.service }}]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(inputs.service-names) }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry-host }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 🏷️ Resolve Image Tags & Build Args
        id: meta
        run: |
          REG_URL=$(echo "${{ secrets.REGISTRY_URL }}" | sed 's:/*$::')
          SERVICE_NAME="${{ inputs.image-prefix }}${{ matrix.service }}"

          if [ -z "$SERVICE_NAME" ] || [ "$SERVICE_NAME" = "." ] || [ "$SERVICE_NAME" = "root" ] || [ "$SERVICE_NAME" = "app" ]; then
            BASE_NAME="$REG_URL"
          elif [ "$(basename "$REG_URL")" = "$SERVICE_NAME" ]; then
            BASE_NAME="$REG_URL"
          else
            BASE_NAME="${REG_URL}/${SERVICE_NAME}"
          fi

          # Resolve build-args
          BUILD_ARGS=""
          if [ "${{ inputs.use-build-arg-app-name }}" = "true" ]; then
            BUILD_ARGS="APP_NAME=${{ matrix.service }}"
          fi

          echo "Resolved Docker image target: ${BASE_NAME}"
          echo "Resolved build-args: ${BUILD_ARGS}"
          echo "tag_sha=${BASE_NAME}:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "tag_latest=${BASE_NAME}:latest" >> $GITHUB_OUTPUT
          echo "build_args=${BUILD_ARGS}" >> $GITHUB_OUTPUT

      - name: 📦 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.dockerfile-context }}
          file: ${{ inputs.dockerfile-path }}
          target: ${{ inputs.dockerfile-target != '' && inputs.dockerfile-target || null }}
          build-args: |
            ${{ steps.meta.outputs.build_args }}
          push: true
          tags: |
            ${{ steps.meta.outputs.tag_sha }}
            ${{ steps.meta.outputs.tag_latest }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  notify-env-holder:
    name: 🚀 Trigger env-holder Deploy
    needs: build-and-push
    if: inputs.trigger-env-holder
    runs-on: ubuntu-latest
    steps:
      - name: ⚡ Trigger Webhook (Deploy to Server)
        env:
          WEBHOOK_URL: ${{ secrets.ENV_HOLDER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "ℹ️ ENV_HOLDER_WEBHOOK_URL secret not provided. Skipping auto-trigger."
            echo "You can deploy anytime from the env-holder UI."
            exit 0
          fi

          echo "Pinging env-holder webhook for branch '${{ github.ref_name }}'..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "sender": "github-actions",
              "commitSha": "${{ github.sha }}",
              "commitMessage": "${{ github.event.head_commit.message }}",
              "branch": "${{ github.ref_name }}",
              "imageTag": "${{ github.sha }}"
            }')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response code: $HTTP_CODE"
          echo "$BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ env-holder accepted deployment trigger successfully!"
          else
            echo "❌ env-holder trigger returned HTTP $HTTP_CODE"
            exit 1
          fi
